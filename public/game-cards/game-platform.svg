    <text x="112" y="516" fill="#f6f5f0" font-size="26" font-weight="600">A portfolio with a playful side.</text>
  </g>
  <g transform="translate(738 240)">
    <rect width="350" height="270" rx="24" fill="#fff" stroke="#20211f" stroke-opacity=".12" stroke-width="2"/>
    <text x="34" y="87" font-family="Arial, sans-serif" fill="#777871" font-size="14" font-weight="700" letter-spacing="2">THE GAME COLLECTION</text>
    <g font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#20211f">
      <rect x="28" y="110" width="294" height="42" rx="10" fill="#f6f5f0"/>
      <text x="48" y="137">Memory Match</text><text x="298" y="137" text-anchor="end" fill="#829f35">↗</text>
      <rect x="28" y="162" width="294" height="42" rx="10" fill="#edf3de"/>
      <text x="48" y="189">Tic-tac-toe</text><text x="298" y="189" text-anchor="end" fill="#829f35">↗</text>
      <rect x="28" y="214" width="294" height="42" rx="10" fill="#f6f5f0"/>
      <text x="48" y="241">Context Guess</text><text x="298" y="241" text-anchor="end" fill="#829f35">↗</text>
