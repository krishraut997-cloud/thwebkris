<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Krish Raut — Playful web experiences</title>
  <desc id="description">A preview of Krish Raut's browser-game portfolio and Python-powered score platform.</desc>
  <rect width="1200" height="630" fill="#f6f5f0"/>
  <circle cx="1020" cy="90" r="220" fill="#eaeae2"/>
  <circle cx="1090" cy="540" r="190" fill="#dce7bd"/>
  <g font-family="Arial, sans-serif" fill="#20211f">
    <text x="82" y="88" font-size="24" font-weight="700" letter-spacing="5">KR.  /  PORTFOLIO</text>
    <text x="82" y="224" font-size="76" font-weight="700" letter-spacing="-4">Small games.</text>
    <text x="82" y="311" font-size="76" font-weight="700" letter-spacing="-4">Thoughtful code.</text>
    <text x="86" y="369" font-size="25" fill="#777871">React games · Python score API · Live leaderboard</text>
  </g>
  <rect x="82" y="426" width="490" height="125" rx="18" fill="#20211f"/>
  <g font-family="Arial, sans-serif">
