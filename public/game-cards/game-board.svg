<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Context Guess sample game board</title>
  <desc id="description">An illustration of a Context Guess round with related words and semantic ranks.</desc>
  <rect width="1200" height="900" fill="#eaeae2"/>
  <circle cx="1050" cy="145" r="115" fill="#dce7bd"/>
  <circle cx="143" cy="768" r="92" fill="#d8d5c9"/>
  <rect x="115" y="95" width="970" height="710" rx="34" fill="#fff" stroke="#20211f" stroke-opacity=".1" stroke-width="3"/>
  <circle cx="165" cy="150" r="10" fill="#829f35"/>
  <text x="192" y="158" font-family="Arial, sans-serif" fill="#777871" font-size="18" font-weight="700" letter-spacing="3">CONTEXT GUESS · SAMPLE ROUND</text>
  <text x="165" y="245" font-family="Arial, sans-serif" fill="#20211f" font-size="45" font-weight="700">Follow the meaning.</text>
  <text x="165" y="292" font-family="Arial, sans-serif" fill="#777871" font-size="23">Try a related word and use its rank as a clue.</text>
  <rect x="165" y="342" width="870" height="78" rx="18" fill="#f6f5f0"/>
  <text x="198" y="391" font-family="Arial, sans-serif" fill="#777871" font-size="22">flower</text>
  <rect x="855" y="354" width="162" height="54" rx="27" fill="#20211f"/>
  <text x="936" y="388" text-anchor="middle" font-family="Arial, sans-serif" fill="#f6f5f0" font-size="18" font-weight="600">Guess word</text>
  <rect x="165" y="454" width="870" height="76" rx="16" fill="#f8f8f5"/>
  <text x="198" y="501" font-family="Arial, sans-serif" fill="#20211f" font-size="23" font-weight="600">garden</text>
  <text x="988" y="501" text-anchor="end" font-family="Arial, sans-serif" fill="#777871" font-size="20">#1240</text>
  <rect x="165" y="548" width="870" height="76" rx="16" fill="#edf3de"/>
  <text x="198" y="595" font-family="Arial, sans-serif" fill="#20211f" font-size="23" font-weight="600">flower</text>
  <text x="988" y="595" text-anchor="end" font-family="Arial, sans-serif" fill="#71862f" font-size="20" font-weight="700">#38</text>
  <rect x="165" y="642" width="870" height="76" rx="16" fill="#dce7bd"/>
  <text x="198" y="689" font-family="Arial, sans-serif" fill="#20211f" font-size="23" font-weight="600">tulip</text>
  <text x="988" y="689" text-anchor="end" font-family="Arial, sans-serif" fill="#526622" font-size="20" font-weight="700">#4</text>
  <text x="165" y="764" font-family="Arial, sans-serif" fill="#777871" font-size="18">Closer meaning, lower rank.</text>
</svg>
