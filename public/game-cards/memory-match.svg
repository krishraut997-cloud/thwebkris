      <rect x="158" y="158" width="124" height="124" rx="14"/>
    </g>
    <g fill="#b5d943" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle">
      <text x="96" y="120">✳</text><text x="254" y="120">✳</text><text x="96" y="278">✦</text><text x="254" y="278">✳</text>
