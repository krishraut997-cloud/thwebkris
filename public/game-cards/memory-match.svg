<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Memory Match — Play by Krish Raut</title>
  <desc id="description">A browser game preview showing a grid of cards and matching pairs.</desc>
  <rect width="1200" height="630" fill="#f6f5f0"/>
  <circle cx="1020" cy="75" r="220" fill="#eaeae2"/>
  <g font-family="Arial, sans-serif" fill="#20211f">
    <text x="82" y="88" font-size="24" font-weight="700" letter-spacing="5">KR.  /  BROWSER GAMES</text>
    <text x="82" y="245" font-size="83" font-weight="700" letter-spacing="-5">Memory Match</text>
    <text x="86" y="307" font-size="27" fill="#777871">Flip the cards. Find every pair.</text>
